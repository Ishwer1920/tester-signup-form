<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tester</title>
  <meta name="description" content="A dark, glassmorphic join form you can host on GitHub Pages." />

  <!-- Inline SVG favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0b'/%3E%3Cpath d='M9 20l5-9 4 6 5-9' stroke='%23d2ff3a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient background -->
  <div class="bg-glow glow-amber"></div>
  <div class="bg-glow glow-lime"></div>
  <div class="bg-glow glow-pink"></div>
  <div class="bg-grid"></div>
  <div class="orbs" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Top-right: suggest a dev name -->
  <button type="button" class="suggest-btn" id="suggest-btn">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.6 1 1.3 1 2V16h6v-.5c0-.7.3-1.4 1-2A6 6 0 0 0 12 3z"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="label">Suggest a DEV name?</span>
  </button>

  <main class="page">
    <section class="card" aria-live="polite">
      <!-- Logo mark -->
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M4 16l5-9 4 6 5-9 2 3" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </div>

      <!-- ============ VIEW 1: simple join ============ -->
      <div class="view" id="main-view">
        <header class="card-head">
          <h1>Join as a tester</h1>
          <p>Drop your name and email — we'll be in touch.</p>
        </header>

        <form id="join-form" novalidate>
          <div class="field">
            <label for="j-name">Name</label>
            <input id="j-name" name="name" type="text" autocomplete="name" required
                   placeholder="John Carter" />
            <small class="error" data-for="name"></small>
          </div>

          <div class="field">
            <label for="j-email">Email</label>
            <input id="j-email" name="email" type="email" autocomplete="email" required
                   placeholder="you@example.com" />
            <small class="error" data-for="email"></small>
          </div>

          <label class="check">
            <input type="checkbox" name="android" value="Yes" />
            <span>I'm an Android user.</span>
          </label>

          <label class="check">
            <input type="checkbox" name="agree" />
            <span>I agree to the <a href="#" tabindex="0">Terms</a> &amp; <a href="#" tabindex="0">Privacy Policy</a>.</span>
          </label>
          <small class="error" data-for="agree"></small>

          <button type="submit" class="btn-primary"><span>Submit</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>

        <!-- Divider + developer CTA (icon on the left) -->
        <div class="divider"><span>or</span></div>

        <button type="button" class="dev-cta" id="open-dev">
          <span class="dev-cta-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="dev-cta-text">
            <strong>Wanna join the developer?</strong>
            <small>Apply to our dev team</small>
          </span>
          <svg class="dev-cta-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                  fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- ============ VIEW 2: developer application ============ -->
      <div class="view" id="dev-view" hidden>
        <button type="button" class="back" id="back-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Back
        </button>

        <header class="card-head">
          <h1>Join the dev team</h1>
          <p>Tell us a bit about yourself.</p>
        </header>

        <form id="dev-form" novalidate>
          <div class="field">
            <label for="d-name">Name</label>
            <input id="d-name" name="name" type="text" autocomplete="name" required
                   placeholder="John Carter" />
            <small class="error" data-for="name"></small>
          </div>

          <div class="field">
            <label for="d-email">Email</label>
            <input id="d-email" name="email" type="email" autocomplete="email" required
                   placeholder="you@example.com" />
            <small class="error" data-for="email"></small>
          </div>

          <div class="row">
            <div class="field">
              <label for="d-phone">Phone number</label>
              <input id="d-phone" name="phone" type="tel" autocomplete="tel"
                     placeholder="+1 555 000 000" />
              <small class="error" data-for="phone"></small>
            </div>

            <div class="field">
              <label for="d-skill">Skill</label>
              <div class="select-wrap">
                <select id="d-skill" name="skill">
                  <option value="" disabled selected>Select…</option>
                  <option>Frontend</option>
                  <option>Backend</option>
                  <option>Full-Stack</option>
                  <option>Mobile</option>
                  <option>UI / UX Design</option>
                  <option>DevOps</option>
                  <option>Blockchain / Web3</option>
                  <option>Other</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"
                        fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <small class="error" data-for="skill"></small>
            </div>
          </div>

          <div class="field">
            <label for="d-message">Wanna say something?</label>
            <textarea id="d-message" name="message" rows="3"
                      placeholder="Tell us why you'd like to join…"></textarea>
            <small class="error" data-for="message"></small>
          </div>

          <!-- a few more useful things for a dev application -->
          <div class="field">
            <label for="d-link">Portfolio / GitHub link <span class="opt">(optional)</span></label>
            <input id="d-link" name="link" type="url" autocomplete="url"
                   placeholder="https://github.com/you" />
            <small class="error" data-for="link"></small>
          </div>

          <label class="check">
            <input type="checkbox" name="agree" />
            <span>I agree to be contacted about this application.</span>
          </label>
          <small class="error" data-for="agree"></small>

          <button type="submit" class="btn-primary"><span>Submit application</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
      </div>

      <!-- ============ VIEW 3: suggest a dev name ============ -->
      <div class="view" id="suggest-view" hidden>
        <button type="button" class="back" id="suggest-back">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Back
        </button>

        <!-- Step 1: the suggestion box -->
        <div id="suggest-step">
          <header class="card-head">
            <h1>Suggest a dev name</h1>
            <p>Got a cool name for our dev? Drop it below.</p>
          </header>

          <form id="suggest-form" novalidate>
            <div class="field">
              <label for="s-name">Dev name</label>
              <input id="s-name" name="suggestion" type="text"
                     placeholder="e.g. Nova, Pixel, Byte…" />
              <small class="error" data-for="suggestion"></small>
            </div>
            <button type="submit" class="btn-primary"><span>Submit</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </form>
        </div>

        <!-- Step 2: did you fill the tester form? -->
        <div id="suggest-ask" hidden>
          <header class="card-head">
            <h1>Nice, thanks!</h1>
            <p>Did you fill the tester form?</p>
          </header>
          <div class="ask-actions">
            <button type="button" class="btn-primary" id="ask-yes"><span>Yes, I did</span></button>
            <button type="button" class="btn-ghost" id="ask-no">No — open it for me</button>
          </div>
        </div>
      </div>

      <!-- ============ shared success ============ -->
      <div class="success" id="success" hidden>
        <div class="success-ring" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none">
            <path class="tick" d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h2>Thank you!</h2>
        <p id="success-text">Thanks — we'll reach you shortly.</p>
        <button type="button" class="btn-ghost" id="reset-btn">Done</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
